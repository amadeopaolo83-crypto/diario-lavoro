name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Genera progetto Android
        run: |
          mkdir -p app/src/main/java/it/diario/lavoro app/src/main/res/xml app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/values app/src/main/assets
          cp index.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'DiarioLavoro'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'it.diario.lavoro'
              compileSdk 34
              defaultConfig {
                  applicationId 'it.diario.lavoro'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.core:core:1.12.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Diario lavoro"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fp"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="export" path="export/" />
          </paths>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_bg">#1F3A5F</color>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M34,28h40v52h-40z" />
              <path android:fillColor="#1F3A5F" android:pathData="M40,38h28v4h-28z" />
              <path android:fillColor="#1F3A5F" android:pathData="M40,48h28v4h-28z" />
              <path android:fillColor="#1F3A5F" android:pathData="M40,58h28v4h-28z" />
              <path android:fillColor="#1F3A5F" android:pathData="M40,68h18v4h-18z" />
          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          EOF

          cat > app/src/main/java/it/diario/lavoro/MainActivity.java <<'EOF'
          package it.diario.lavoro;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.JsResult;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.widget.Toast;
          import androidx.core.content.FileProvider;
          import java.io.File;
          import java.io.FileOutputStream;

          public class MainActivity extends Activity {
              private WebView web;
              private ValueCallback<Uri[]> chooserCb;
              private static final int REQ = 1;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  web.addJavascriptInterface(new Bridge(), "Android");
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (chooserCb != null) chooserCb.onReceiveValue(null);
                          chooserCb = cb;
                          Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType("*/*");
                          startActivityForResult(Intent.createChooser(i, "Scegli la copia di sicurezza"), REQ);
                          return true;
                      }
                      @Override
                      public boolean onJsAlert(WebView v, String url, String msg, final JsResult r) {
                          new AlertDialog.Builder(MainActivity.this).setMessage(msg)
                              .setPositiveButton("OK", (d, w) -> r.confirm())
                              .setOnCancelListener(d -> r.cancel()).show();
                          return true;
                      }
                      @Override
                      public boolean onJsConfirm(WebView v, String url, String msg, final JsResult r) {
                          new AlertDialog.Builder(MainActivity.this).setMessage(msg)
                              .setPositiveButton("OK", (d, w) -> r.confirm())
                              .setNegativeButton("Annulla", (d, w) -> r.cancel())
                              .setOnCancelListener(d -> r.cancel()).show();
                          return true;
                      }
                  });
                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == REQ && chooserCb != null) {
                      Uri[] r = null;
                      if (res == RESULT_OK && data != null && data.getData() != null) {
                          r = new Uri[]{data.getData()};
                      }
                      chooserCb.onReceiveValue(r);
                      chooserCb = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }

              private class Bridge {
                  @JavascriptInterface
                  public void condividi(final String nome, final String testo, final String mime) {
                      runOnUiThread(() -> {
                          try {
                              File dir = new File(getCacheDir(), "export");
                              dir.mkdirs();
                              File f = new File(dir, nome);
                              FileOutputStream o = new FileOutputStream(f);
                              o.write(testo.getBytes("UTF-8"));
                              o.close();
                              Uri u = FileProvider.getUriForFile(MainActivity.this, getPackageName() + ".fp", f);
                              Intent i = new Intent(Intent.ACTION_SEND);
                              i.setType(mime.split(";")[0]);
                              i.putExtra(Intent.EXTRA_STREAM, u);
                              i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                              startActivity(Intent.createChooser(i, "Salva su Drive"));
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Errore: " + e.getMessage(), Toast.LENGTH_LONG).show();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void stampa() {
                      runOnUiThread(() -> {
                          PrintManager pm = (PrintManager) getSystemService(PRINT_SERVICE);
                          pm.print("Diario eventi", web.createPrintDocumentAdapter("Diario eventi"),
                              new PrintAttributes.Builder().build());
                      });
                  }
              }
          }
          EOF

      - name: Compila APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: diario-lavoro-apk
          path: app/build/outputs/apk/debug/app-debug.apk
