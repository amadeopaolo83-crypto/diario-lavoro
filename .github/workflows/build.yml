<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diario eventi di lavoro</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f2f4f7;color:#222}
header{background:#1f3a5f;color:#fff;padding:12px 16px}
header h1{margin:0;font-size:20px}
main{max-width:900px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:8px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
label{display:block;font-weight:bold;font-size:14px;margin-top:10px}
input,textarea,select{width:100%;padding:8px;font-size:16px;border:1px solid #bbb;border-radius:5px;font-family:inherit}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>div{flex:1;min-width:140px}
button{padding:10px 14px;font-size:15px;border:0;border-radius:5px;background:#1f3a5f;color:#fff;cursor:pointer;margin:4px 4px 0 0}
button.sec{background:#6b7785}
button.red{background:#a33}
.hint{font-size:12px;color:#666;font-weight:normal}
.entry{border-left:5px solid #1f3a5f}
.entry h3{margin:0 0 4px;font-size:16px}
.meta{font-size:12px;color:#666;margin-bottom:6px}
.entry p{margin:4px 0;white-space:pre-wrap}
.tag{display:inline-block;background:#e3e9f1;border-radius:10px;padding:2px 8px;font-size:12px;margin-right:4px}
.gravita-alta{border-left-color:#c0392b}
.gravita-media{border-left-color:#e6a100}
#cerca{margin-bottom:8px}
@media print{header,#formcard,.noprint,button{display:none!important}body{background:#fff}.card{box-shadow:none;border:1px solid #999;page-break-inside:avoid}}
</style>
</head>
<body>
<header><h1>Diario eventi di lavoro</h1></header>
<main>

<div class="card" id="formcard">
<h2 id="titoloForm" style="margin:0 0 4px;font-size:18px">Nuovo evento</h2>
<form id="f" autocomplete="off">
<input type="hidden" id="id">
<div class="row">
<div><label>Data</label><input type="date" id="data" required></div>
<div><label>Ora (circa)</label><input type="time" id="ora"></div>
</div>
<label>Luogo</label><input id="luogo" placeholder="Es. ufficio, reparto, mensa, telefono...">
<label>Chi ha fatto / detto <span class="hint">(nome e ruolo)</span></label><input id="chi">
<label>Chi era presente <span class="hint">(possibili testimoni)</span></label><input id="presenti">
<label>Cosa è successo <span class="hint">(fatti, non opinioni; le frasi dette il più possibile con le parole esatte)</span></label>
<textarea id="fatto" required></textarea>
<label>Come ho reagito / cosa ho risposto</label><textarea id="reazione"></textarea>
<label>Conseguenze <span class="hint">(per il lavoro, la salute, lo stato d'animo)</span></label><textarea id="conseguenze"></textarea>
<div class="row">
<div><label>Tipo</label>
<select id="tipo">
<option>Verbale (parole)</option>
<option>Comportamento</option>
<option>Esclusione / isolamento</option>
<option>Cambio di mansione / turno</option>
<option>Carico di lavoro / compiti</option>
<option>Richiamo / contestazione</option>
<option>Altro</option>
</select></div>
<div><label>Gravità</label>
<select id="gravita"><option>Bassa</option><option>Media</option><option>Alta</option></select></div>
</div>
<label>Ho mandato mail di conferma?</label>
<select id="mail"><option>No</option><option>Sì</option></select>
<label>Note / documenti collegati <span class="hint">(es. mail, foto, certificato medico)</span></label><textarea id="note"></textarea>
<button type="submit" id="salva">Salva evento</button>
<button type="button" class="sec" id="annulla" style="display:none">Annulla modifica</button>
</form>
</div>

<div class="card noprint">
<input id="cerca" placeholder="Cerca (nome, parola, luogo...)">
<button id="csv">Esporta Excel (CSV)</button>
<button id="json" class="sec">Salva copia di sicurezza</button>
<button id="imp" class="sec">Ripristina copia</button>
<button id="stampa" class="sec">Stampa / PDF</button>
<input type="file" id="file" accept=".json" style="display:none">
<div class="hint" id="hintdati" style="margin-top:8px">I dati restano in questo browser. Fai una copia di sicurezza ogni tanto e conservala fuori dal PC aziendale.</div>
</div>

<div id="count" class="hint noprint" style="margin:0 4px 8px"></div>
<div id="lista"></div>
</main>

<script>
var KEY="diarioLavoro_v1";
var dati=[];
try{dati=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){dati=[]}
function salvaLS(){try{localStorage.setItem(KEY,JSON.stringify(dati))}catch(e){alert("Impossibile salvare nel browser. Fai subito una copia di sicurezza.")}}
function $(i){return document.getElementById(i)}
var campi=["data","ora","luogo","chi","presenti","fatto","reazione","conseguenze","tipo","gravita","mail","note"];
function oggi(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function adesso(){return new Date().toLocaleString("it-IT")}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function fmtData(s){if(!s)return"";var p=s.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function reset(){$("f").reset();$("id").value="";$("data").value=oggi();$("titoloForm").textContent="Nuovo evento";$("annulla").style.display="none";$("salva").textContent="Salva evento"}
$("f").onsubmit=function(ev){
  ev.preventDefault();
  var id=$("id").value;var o={};
  campi.forEach(function(c){o[c]=$(c).value});
  if(id){
    var e=dati.filter(function(x){return x.id==id})[0];
    campi.forEach(function(c){e[c]=o[c]});
    e.modificato=adesso();
  }else{
    o.id=String(Date.now());o.registrato=adesso();dati.push(o);
  }
  salvaLS();reset();disegna();window.scrollTo(0,document.body.scrollHeight>0?$("lista").offsetTop-10:0);
};
$("annulla").onclick=reset;
function modifica(id){
  var e=dati.filter(function(x){return x.id==id})[0];if(!e)return;
  campi.forEach(function(c){$(c).value=e[c]||""});
  $("id").value=id;$("titoloForm").textContent="Modifica evento";$("annulla").style.display="inline-block";$("salva").textContent="Salva modifica";
  window.scrollTo(0,0);
}
function elimina(id){
  if(!confirm("Eliminare definitivamente questo evento?"))return;
  dati=dati.filter(function(x){return x.id!=id});salvaLS();disegna();
}
function disegna(){
  var q=$("cerca").value.toLowerCase();
  var l=dati.slice().sort(function(a,b){return (b.data+(b.ora||""))>(a.data+(a.ora||""))?1:-1});
  if(q)l=l.filter(function(e){return JSON.stringify(e).toLowerCase().indexOf(q)>=0});
  $("count").textContent=l.length+" eventi"+(q?" trovati":" registrati");
  var h="";
  l.forEach(function(e){
    h+='<div class="card entry gravita-'+esc((e.gravita||"").toLowerCase())+'">'+
    '<h3>'+fmtData(e.data)+(e.ora?' - '+esc(e.ora):'')+(e.luogo?' - '+esc(e.luogo):'')+'</h3>'+
    '<div class="meta"><span class="tag">'+esc(e.tipo)+'</span><span class="tag">Gravità: '+esc(e.gravita)+'</span><span class="tag">Mail conferma: '+esc(e.mail)+'</span><br>Registrato il '+esc(e.registrato)+(e.modificato?' - modificato il '+esc(e.modificato):'')+'</div>'+
    (e.chi?'<p><b>Chi:</b> '+esc(e.chi)+'</p>':'')+
    (e.presenti?'<p><b>Presenti:</b> '+esc(e.presenti)+'</p>':'')+
    '<p><b>Fatto:</b> '+esc(e.fatto)+'</p>'+
    (e.reazione?'<p><b>Mia reazione:</b> '+esc(e.reazione)+'</p>':'')+
    (e.conseguenze?'<p><b>Conseguenze:</b> '+esc(e.conseguenze)+'</p>':'')+
    (e.note?'<p><b>Note:</b> '+esc(e.note)+'</p>':'')+
    '<button class="sec noprint" onclick="modifica(\''+e.id+'\')">Modifica</button>'+
    '<button class="red noprint" onclick="elimina(\''+e.id+'\')">Elimina</button></div>';
  });
  $("lista").innerHTML=h||'<div class="card">Nessun evento.</div>';
}
$("cerca").oninput=disegna;
function scarica(nome,testo,tipo){
  if(window.Android&&Android.condividi){Android.condividi(nome,testo,tipo);return}
  var b=new Blob([testo],{type:tipo});var a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download=nome;document.body.appendChild(a);a.click();document.body.removeChild(a);
}
$("csv").onclick=function(){
  var cols=["data","ora","luogo","chi","presenti","fatto","reazione","conseguenze","tipo","gravita","mail","note","registrato","modificato"];
  var r=[cols.join(";")];
  dati.slice().sort(function(a,b){return a.data>b.data?1:-1}).forEach(function(e){
    r.push(cols.map(function(c){return '"'+String(e[c]||"").replace(/"/g,'""').replace(/\r?\n/g," ")+'"'}).join(";"));
  });
  scarica("diario-eventi.csv","\ufeff"+r.join("\r\n"),"text/csv;charset=utf-8");
};
$("json").onclick=function(){scarica("diario-copia-"+oggi()+".json",JSON.stringify(dati),"application/json")};
$("imp").onclick=function(){$("file").click()};
$("file").onchange=function(){
  var f=this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){
    try{
      var n=JSON.parse(r.result);if(!Array.isArray(n))throw 0;
      var ids={};dati.forEach(function(x){ids[x.id]=1});
      var agg=0;n.forEach(function(x){if(!ids[x.id]){dati.push(x);agg++}});
      salvaLS();disegna();alert("Ripristino fatto. Eventi aggiunti: "+agg);
    }catch(e){alert("File non valido.")}
  };r.readAsText(f);this.value="";
};
$("stampa").onclick=function(){if(window.Android&&Android.stampa){Android.stampa();return}window.print()};
if(window.Android){$("hintdati").textContent="I dati restano nel telefono. Per metterli su Google Drive tocca Esporta o Copia di sicurezza e scegli Drive.";}
reset();disegna();
</script>
</body>
</html>
